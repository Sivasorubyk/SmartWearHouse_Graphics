<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive real-time 3D smart warehouse simulation" />
    <title>Smart Warehouse | Advanced Computer Graphics</title>
  </head>
  <body>
    <div id="app"></div>
    <section id="hud">
      <div class="brand"><span class="dot"></span> SMART WAREHOUSE <small>REAL-TIME 3D</small></div>

    <section id="help">
      <strong>CONTROLS</strong>
      <span><kbd>1</kbd> Perspective</span><span><kbd>2</kbd> Top</span><span><kbd>3</kbd> Follow</span>
      <span><kbd>WASD</kbd> Drive</span><span><kbd>Space</kbd> Pause</span><span><kbd>N</kbd> Day/Night</span>
      <span><kbd>F</kbd> Wireframe</span><span><kbd>R</kbd> Reset</span><span>Mouse: orbit / zoom</span>
    </section>
    <script type="module" src="/src/main.js"></script>

</html>
